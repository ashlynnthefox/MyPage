<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>dashboard</title>
<link rel="stylesheet" href="../style.css" />
<!-- Owner-only. Not linked from anywhere, not indexed. -->
<style>
  #dash input[type=text],#dash textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #cf8fa0;font-family:inherit;font-size:13px}
  #dash button{font-family:inherit;font-size:12px;font-weight:700;padding:7px 16px;border-radius:14px;border:1px solid #8f1d3d;background:linear-gradient(#ff7d9c,#e0315f);color:#fff;cursor:pointer;margin-right:6px}
  #dash button.plain{background:linear-gradient(#fff,#f6cdd8);color:#57182a;border-color:#cf8fa0}
  .draft{border-bottom:1px solid #f0d5dd;padding:8px 0}
  .draft small{color:#777}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap"><span>★ dashboard</span></div>
</div>

<div class="wrap layout" style="grid-template-columns:1fr">
  <main>
    <section class="panel">
      <div class="panel-head"><span>blog editor</span></div>
      <div class="panel-body" id="dash">
        <div id="gate">
          <p class="muted"><i>Owner password required.</i></p>
          <p><input type="password" id="pw" placeholder="password" /></p>
          <p><button id="go">unlock</button></p>
          <p class="muted" id="err"></p>
        </div>
        <div id="editor" hidden>
          <p><input type="text" id="title" maxlength="120" placeholder="post title" /></p>
          <p><textarea id="body" rows="8" placeholder="write the post… (blank lines = new paragraphs)"></textarea></p>
          <p><button id="add">add post</button></p>
          <hr/>
          <div id="list"></div>
          <hr/>
          <p><button id="publish">publish → download blog.html</button></p>
          <p class="muted"><i>Upload that file next to index.html to put the posts on the site. Drafts also auto-save in this browser.</i></p>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
// Same owner lock as the main site. Password itself is not in this file — only its hash.
const PRESET = {
  salt: 'k7Qm2XvL9pR4tYwZ',
  hash: '76f403fc212bd855bd6170a20c1e5915971f7187c623459819325dd7fe214d94'
};
const te = new TextEncoder();
const subtleOK = !!(window.crypto && crypto.subtle);
async function shaHex(s) {
  const d = await crypto.subtle.digest('SHA-256', te.encode(s));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const load = () => { try { return JSON.parse(localStorage.getItem('ashlynn-posts') || '[]'); } catch (e) { return []; } };
const save = p => { try { localStorage.setItem('ashlynn-posts', JSON.stringify(p)); } catch (e) {} };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function render() {
  const posts = load();
  const list = document.getElementById('list');
  list.innerHTML = posts.length ? '' : '<p class="muted"><i>No drafts yet.</i></p>';
  posts.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'draft';
    const b = document.createElement('b');
    b.textContent = p.title;
    const s = document.createElement('small');
    s.textContent = ' — ' + p.date;
    const del = document.createElement('button');
    del.className = 'plain';
    del.textContent = 'delete';
    del.onclick = () => { if (confirm('Delete this post?')) { posts.splice(i, 1); save(posts); render(); } };
    const edit = document.createElement('button');
    edit.className = 'plain';
    edit.textContent = 'edit';
    edit.onclick = () => {
      document.getElementById('title').value = p.title;
      document.getElementById('body').value = p.body;
      posts.splice(i, 1); save(posts); render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    d.append(b, s, document.createElement('br'), del, edit);
    list.appendChild(d);
  });
}

function buildBlog(posts) {
  const arts = posts.length ? posts.map(p => {
    const paras = esc(p.body).split(/\n\s*\n/).map(t => '<p>' + t.replace(/\n/g, '<br/>') + '</p>').join('\n');
    return '<article class="proj">\n<div class="postdate">' + esc(p.date) + '</div>\n<h3>' + esc(p.title) + '</h3>\n' + paras + '\n</article>';
  }).join('\n<hr/>\n') : '<p class="muted"><i>Nothing here yet — check back soon.</i></p>';
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8" />\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n<title>ashlynn — blog</title>\n' +
    '<link rel="stylesheet" href="style.css" />\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">\n</head>\n<body>\n\n' +
    '<div class="topbar">\n  <div class="wrap">\n    <span>★ ashlynn • van wert, ohio</span>\n  </div>\n</div>\n\n' +
    '<nav class="mainnav">\n  <div class="wrap">\n    <a href="index.html" class="brand">ashlynn</a>\n' +
    '    <div class="links">\n      <a href="index.html">Home</a>\n      <a href="art.html">Art</a>\n' +
    '      <a href="projects.html">Projects</a>\n      <a href="blog.html" class="active">Blog</a>\n    </div>\n  </div>\n</nav>\n\n' +
    '<div class="wrap layout">\n  <main>\n    <section class="panel">\n' +
    '      <div class="panel-head"><span>blog</span></div>\n      <div class="panel-body">\n' +
    arts + '\n      </div>\n    </section>\n  </main>\n\n' +
    '  <aside>\n    <div class="panel widget">\n      <div class="panel-head"><span>about</span></div>\n' +
    '      <div class="panel-body small">\n        <p>Brain dumps, process posts, whatever I\'m into. New stuff lands here whenever I write it.</p>\n      </div>\n    </div>\n  </aside>\n</div>\n\n' +
    '<footer>\n  <div class="wrap">© ' + new Date().getFullYear() + ' ashlynn</div>\n</footer>\n\n</body>\n</html>\n';
}

async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  if (!pw || !subtleOK) { err.textContent = !pw ? '' : 'Need a modern browser for unlock.'; return; }
  let ok = false;
  try {
    const auth = JSON.parse(localStorage.getItem('ashlynn-auth') || 'null');
    ok = auth && auth.salt
      ? (await shaHex(auth.salt + '::' + pw)) === auth.hash
      : (await shaHex(PRESET.salt + '::' + pw)) === PRESET.hash;
  } catch (e) {}
  if (!ok) { err.textContent = 'Wrong password.'; return; }
  document.getElementById('gate').hidden = true;
  document.getElementById('editor').hidden = false;
  render();
}
document.getElementById('go').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

document.getElementById('add').onclick = () => {
  const title = document.getElementById('title').value.trim().slice(0, 120);
  const body = document.getElementById('body').value.trim();
  if (!title || !body) return;
  const posts = load();
  posts.unshift({ title, body, date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) });
  save(posts);
  document.getElementById('title').value = '';
  document.getElementById('body').value = '';
  render();
};

document.getElementById('publish').onclick = () => {
  const blob = new Blob([buildBlog(load())], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'blog.html';
  a.click();
};
</script>
</body>
</html>
