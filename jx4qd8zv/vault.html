<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>vault</title>
<link rel="stylesheet" href="../style.css" />
<!-- NOT linked from anywhere. Only opens by direct URL. -->
<style>
  #gate{max-width:340px;margin:60px auto;text-align:center}
  #gate input{width:100%;padding:10px;border-radius:10px;border:1px solid #cf8fa0;font-family:inherit}
  #gate button{margin-top:10px;font-family:inherit;font-size:13px;font-weight:700;padding:8px 24px;border-radius:16px;border:1px solid #8f1d3d;background:linear-gradient(#ff7d9c,#e0315f);color:#fff;cursor:pointer}
  #vault-list{display:flex;flex-direction:column;gap:8px}
  .v-note{display:flex;gap:10px;align-items:flex-start}
  .v-note button{flex:none;font-size:11px;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap"><span>★ private vault</span></div>
</div>

<div class="wrap layout" style="grid-template-columns:1fr">
  <main id="content">
    <section class="panel">
      <div class="panel-head"><span>private notes vault</span></div>
      <div class="panel-body">
        <div id="gate">
          <p class="muted"><i>Owner password required.</i></p>
          <p><input id="vault-pw" type="password" placeholder="password" /></p>
          <p><button id="vault-go">unlock</button></p>
          <p class="muted" id="vault-err"></p>
        </div>
        <div id="vault-list" hidden></div>
        <div id="compose" hidden>
          <hr/>
          <p><textarea id="v-text" rows="3" maxlength="300" placeholder="new private note…"></textarea></p>
          <p><button id="v-add">save private note</button></p>
        </div>
      </div>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">© <span id="year">2026</span> ashlynn</div>
</footer>

<script>
// Self-contained: same lock as the main site, nothing shared.
// Password itself is NOT in this file — only its salted hash.
const PRESET = {
  salt: 'k7Qm2XvL9pR4tYwZ',
  hash: '76f403fc212bd855bd6170a20c1e5915971f7187c623459819325dd7fe214d94'
};
const te = new TextEncoder(), td = new TextDecoder();
const subtleOK = !!(window.crypto && crypto.subtle);
const bufToB64 = buf => {
  const b = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
};
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function shaHex(str) {
  const d = await crypto.subtle.digest('SHA-256', te.encode(str));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function decNotes(pw, env) {
  if (!env) return [];
  if (env.alg === 'b64' || !subtleOK) {
    try { return JSON.parse(decodeURIComponent(escape(atob(env.ct)))); } catch (e) { return []; }
  }
  try {
    const key = await crypto.subtle.importKey('raw', await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: b64ToBytes(env.salt), iterations: 120000, hash: 'SHA-256' },
      await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']),
      256, false), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(env.iv) }, key, b64ToBytes(env.ct).buffer);
    return JSON.parse(td.decode(pt));
  } catch (e) { return null; }
}
let vaultPw = null;
async function persistVault(notes) {
  if (!vaultPw || !subtleOK) return;
  const saltBytes = new Uint8Array(16);
  crypto.getRandomValues(saltBytes);
  const key = await crypto.subtle.importKey('raw', await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: saltBytes, iterations: 120000, hash: 'SHA-256' },
    await crypto.subtle.importKey('raw', te.encode(vaultPw), 'PBKDF2', false, ['deriveBits']),
    256, false), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  const iv = new Uint8Array(12);
  crypto.getRandomValues(iv);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(notes)));
  try {
    localStorage.setItem('ashlynn-priv', JSON.stringify({
      alg: 'aes', salt: bufToB64(saltBytes.buffer), iv: bufToB64(iv.buffer), ct: bufToB64(ct)
    }));
  } catch (e) {}
}

document.getElementById('year').textContent = new Date().getFullYear();

async function loadVault(pw) {
  let env = null;
  try { env = JSON.parse(localStorage.getItem('ashlynn-priv') || 'null'); } catch (e) {}
  if (!env) { // legacy plaintext leftovers
    try {
      const old = JSON.parse(localStorage.getItem('ashlynn-priv-v2') || '[]');
      return Array.isArray(old) ? old : [];
    } catch (e) { return []; }
  }
  return decNotes(pw, env);
}

let vaultNotes = [];
function renderVault() {
  const notes = vaultNotes;
  const list = document.getElementById('vault-list');
  list.hidden = false;
  document.getElementById('gate').hidden = true;
  list.innerHTML = notes.length ? '' : '<p class="muted"><i>No private notes on this device yet.</i></p>';
  notes.forEach((n, i) => {
    const d = document.createElement('div');
    d.className = 'note v-note';
    const body = document.createElement('div');
    const b = document.createElement('b');
    b.textContent = n.name;
    const p = document.createElement('p');
    p.textContent = n.text;
    p.style.margin = '4px 0';
    const s = document.createElement('small');
    s.textContent = n.date || '';
    body.append(b, p, s);
    const del = document.createElement('button');
    del.textContent = 'delete';
    del.onclick = async () => {
      if (!confirm('Delete this note?')) return;
      notes.splice(i, 1);
      await persistVault(notes);
      d.remove();
      if (!list.querySelector('.note')) list.innerHTML = '<p class="muted"><i>No private notes on this device yet.</i></p>';
    };
    d.append(body, del);
    list.appendChild(d);
  });
}

async function unlock() {
  const pw = document.getElementById('vault-pw').value;
  const err = document.getElementById('vault-err');
  if (!pw) return;
  let ok = false;
  try {
    const auth = JSON.parse(localStorage.getItem('ashlynn-auth') || 'null');
    if (auth && auth.salt && auth.hash) {
      ok = (await shaHex(auth.salt + '::' + pw)) === auth.hash;
    } else {
      ok = (await shaHex(PRESET.salt + '::' + pw)) === PRESET.hash;
    }
  } catch (e) {
    try { ok = (await shaHex(PRESET.salt + '::' + pw)) === PRESET.hash; } catch (e2) {}
  }
  if (!ok) { err.textContent = 'Wrong password.'; return; }
  vaultPw = pw;
  const notes = await loadVault(pw);
  if (notes === null) { err.textContent = 'Could not decrypt notes.'; return; }
  renderVault(notes);
}
document.getElementById('vault-go').onclick = unlock;
document.getElementById('vault-pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
